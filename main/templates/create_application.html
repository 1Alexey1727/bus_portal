{% extends 'base.html' %}
{% block content %}
<div class="application-form">
    <h2 class="page-title">Новая заявка на обучение</h2>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-field">
            <label>Наименование курса</label>
            <select name="course" class="form-input" required>
                <option value="">Выберите курс</option>
                <option value="Автобус">Автобус (категория D)</option>
                <option value="Электробус">Электробус</option>
                <option value="Трамвай">Трамвай</option>
            </select>
        </div>
        
        <div class="form-field">
            <label>Желаемая дата начала обучения</label>
            <input type="date" name="start_date" class="form-input" required>
        </div>
        
        <div class="form-field">
            <label>Способ оплаты</label>
            <select name="payment" class="form-input" required>
                <option value="">Выберите способ</option>
                <option value="cash">Наличными</option>
                <option value="transfer">Перевод по номеру телефона</option>
            </select>
        </div>
        
        <div class="form-field" style="margin-top: 25px;">
            <button type="submit" class="submit-button">Отправить заявку</button>
        </div>
    </form>
    
    <div style="background: #f0f9ff; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 3px solid #3498db;">
        <p style="font-size: 14px; color: #2c3e50;">После отправки заявка будет рассмотрена администратором</p>
    </div>
</div>
{% endblock %}
